server:
  port: 8083
  error:
    include-message: always

# Configuracion de spring
spring:
  application:
    name: pedidos

  # Flyway se configura a mano en PedidosDbConfig y ProductosDbConfig
  flyway:
    enabled: false

  jpa:
    open-in-view: false
    properties:
      hibernate:
        show_sql: true
        format_sql: true

# Configuracion de las dos bases de datos
app:
  datasource:
    primary:
      jdbc-url: jdbc:postgresql://localhost:5432/pedidos_db
      username: postgres
      password: postgres123
      driver-class-name: org.postgresql.Driver
    secondary:
      jdbc-url: jdbc:postgresql://localhost:5432/productos_db
      username: postgres
      password: postgres123
      driver-class-name: org.postgresql.Driver